services:
    db:
        image: postgres:16-alpine
        container_name: task-manager-db
        restart: unless-stopped

        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

            # Será usada pelo script de inicialização para criar
            # a role de conexão do PostgREST.
            POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD}

        ports:
            # Disponível apenas para programas executados nesta máquina.
            - "127.0.0.1:5432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 10

    postgrest:
        image: postgrest/postgrest:v14.15
        container_name: task-manager-postgrest
        restart: unless-stopped

        depends_on:
            db:
                condition: service_healthy

        environment:
            PGRST_DB_URI: "postgres://postgrest_authenticator:${POSTGREST_DB_PASSWORD}@db:5432/${POSTGRES_DB}"
            PGRST_DB_SCHEMAS: api
            PGRST_DB_ANON_ROLE: task_api
            PGRST_SERVER_PORT: 3000

        ports:
            # Porta 3001 da máquina → porta 3000 do container.
            - "127.0.0.1:3001:3000"

volumes:
    postgres_data:
